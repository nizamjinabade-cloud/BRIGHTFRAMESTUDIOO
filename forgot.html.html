<!-- Step 1: ask for email -->
<div id="step1">
  <input id="email" type="email" placeholder="Your Gmail">
  <button onclick="sendOtp()">Send OTP</button>
</div>

<!-- Step 2: enter OTP + new password -->
<div id="step2" style="display:none">
  <input id="otp" type="text" placeholder="Enter OTP">
  <input id="newPass" type="password" placeholder="New password">
  <button onclick="resetPassword()">Change Password</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

const supabase = createClient('https://stkubarpndhteijzqiph.supabase.co', 'sb_publishable_FMcNM1tgyyRYBAkZNdi_CA_mlbu4iWn')

window.sendOtp = async () => {
  const email = document.getElementById('email').value.trim()
  const { error } = await supabase.auth.resetPasswordForEmail(email)
  if (error) return alert(error.message)
  alert('OTP sent! Check your Gmail.')
  document.getElementById('step1').style.display = 'none'
  document.getElementById('step2').style.display = 'block'
}

window.resetPassword = async () => {
  const email = document.getElementById('email').value.trim()
  const token = document.getElementById('otp').value.trim()
  const password = document.getElementById('newPass').value

  if (password.length < 6) return alert('Password must be at least 6 characters')

  // Verify the OTP (this also logs the user in temporarily)
  const { error: otpError } = await supabase.auth.verifyOtp({
    email, token, type: 'recovery'
  })
  if (otpError) return alert('Wrong or expired OTP')

  // Set the new password
  const { error } = await supabase.auth.updateUser({ password })
  if (error) return alert(error.message)

  await supabase.auth.signOut()
  alert('Password changed! Please login with your new password.')
  window.location.href = 'login.html'
}
</script>
