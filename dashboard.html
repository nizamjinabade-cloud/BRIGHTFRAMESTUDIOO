<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | BrightFrame Studio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--lime:#C5FF2E;--lime-soft:#F1FFC7;--lime-pale:#FAFFE9;--ink:#11110F;--soft:#575752;--line:#DDE8A7;--surface:#FCFFF1;--shadow:0 20px 60px rgba(32,38,10,.12)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(180deg,var(--lime-pale),#fff 48%,var(--lime-soft));font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(250,255,233,.94)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.08em;color:var(--ink);text-decoration:none}.brand img{width:38px;height:38px;border-radius:50%}
.btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;font-family:inherit}.btn:hover{background:var(--lime-soft)}.btn.primary{background:var(--lime)}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--shadow)}
label{display:grid;gap:6px;font-size:12px;font-weight:800;letter-spacing:.04em}input,select,textarea{padding:12px 14px;border:1px solid var(--line);border-radius:14px;font:inherit;font-weight:500;background:var(--surface)}textarea{min-height:110px;resize:vertical}
.form{display:grid;gap:14px}.err{color:#c0183f;font-size:13px;min-height:16px}.ok{color:#256b00;font-size:13px;font-weight:700}.muted{color:var(--soft)}.hide{display:none!important}
.badge{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase;background:#fff3c4;white-space:nowrap}.badge.approved{background:var(--lime)}.badge.rejected{background:#ffd6e0}
.modal{position:fixed;inset:0;background:rgba(17,17,15,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}

<main class="wrap hide" id="m"><h1 id="hi">Hello 👋</h1><p class="muted" style="margin:0">Send new requests and track your projects here.</p>
<div class="st" id="st"></div>
<div class="g"><div class="card"><h2 style="margin-top:0">New project request</h2><form class="form" onsubmit="return send(event)"><label>Service<select id="sv"><option>Reel editing</option><option>Poster / banner</option><option>Logo & branding</option><option>Social templates</option><option>Reel creation</option><option>Monthly package</option></select></label><label>WhatsApp number<input id="wa" required placeholder="+91 9XXXXXXXXX"></label><label>Project brief<textarea id="br" required placeholder="Tell us what you want..."></textarea></label><button class="btn primary">Submit request</button><div class="ok hide" id="done">Request sent! We'll review it and update the status here.</div><div class="err" id="err"></div></form></div>

<script>const sb=supabase.createClient('https://stkubarpndhteijzqiph.supabase.co','sb_publishable_FMcNM1tgyyRYBAkZNdi_CA_mlbu4iWn');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user;const fmt=d=>new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const TXT={pending:'Pending review',approved:'Approved',rejected:'Needs changes'};
async function logout(){await sb.auth.signOut();location.replace('login.html')}
async function init(){
 const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('login.html');return}
 user=session.user;const md=user.user_metadata||{};
 let {data:p}=await sb.from('profiles').select('full_name,whatsapp').eq('id',user.id).maybeSingle();
 if(!p){const row={id:user.id,email:user.email,full_name:md.full_name||null,whatsapp:md.whatsapp||null,instagram_username:md.instagram_username||null};await sb.from('profiles').upsert(row);p=row}
 const name=p.full_name||user.email;$('hi').textContent='Hello, '+name.split(' ')[0]+' 👋';$('who').textContent=user.email;if(p.whatsapp)$('wa').value=p.whatsapp;
 $('m').classList.remove('hide');list()}
async function list(){
 const {data:a,error}=await sb.from('applications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error){$('err').textContent=error.message;return}
 const c=s=>a.filter(x=>x.status===s).length;
 $('st').innerHTML=[['Total',a.length],['Pending',c('pending')],['Approved',c('approved')]].map(([l,n])=>`<div class="card"><b>${n}</b><span>${l}</span></div>`).join('');
 $('list').innerHTML=a.length?a.map(x=>`<div class="req"><div><b>${esc(x.service_name)}</b><span class="badge ${esc(x.status)}">${esc(TXT[x.status]||x.status)}</span></div><p>${esc(fmt(x.created_at))} · ${esc(x.project_description)}</p></div>`).join(''):'<p class="muted">No requests yet. Send your first one!</p>'}
async function send(e){e.preventDefault();$('err').textContent='';$('done').classList.add('hide');
 const wa=$('wa').value.trim(),br=$('br').value.trim(),sv=$('sv').value;
 const {error:pe}=await sb.from('profiles').update({whatsapp:wa}).eq('id',user.id);if(pe){$('err').textContent=pe.message;return false}
 const {data:s}=await sb.from('services').select('id').eq('name',sv).maybeSingle();
 const {error}=await sb.from('applications').insert({user_id:user.id,service_id:s?.id||null,service_name:sv,project_description:br,status:'pending'});if(error){$('err').textContent=error.message;return false}
 $('br').value='';$('done').classList.remove('hide');list();return false}
sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.replace('login.html')});
init();
</script></body></html>
