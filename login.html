*{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(180deg,var(--lime-pale),#fff 48%,var(--lime-soft));font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(250,255,233,.94)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.08em;color:var(--ink);text-decoration:none}.brand img{width:38px;height:38px;border-radius:50%}
.btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;font-family:inherit}.btn:hover{background:var(--lime-soft)}.btn.primary{background:var(--lime)}
.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--shadow)}
label{display:grid;gap:6px;font-size:12px;font-weight:800;letter-spacing:.04em}input,select,textarea{padding:12px 14px;border:1px solid var(--line);border-radius:14px;font:inherit;font-weight:500;background:var(--surface)}textarea{min-height:110px;resize:vertical}
.form{display:grid;gap:14px}.err{color:#c0183f;font-size:13px;min-height:16px}.ok{color:#256b00;font-size:13px;font-weight:700}.muted{color:var(--soft)}.hide{display:none!important}
.badge{padding:4px 12px;border-radius:999px;font-size:11px;font-weight:900;text-transform:uppercase;background:#fff3c4;white-space:nowrap}.badge.approved{background:var(--lime)}.badge.rejected{background:#ffd6e0}
.modal{position:fixed;inset:0;background:rgba(17,17,15,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}

<main class="wrap"><div class="card box"><h1 id="ttl">Welcome back</h1><p class="muted" id="sub" style="margin:0">Log in to see your dashboard and requests.</p>
<div class="tabs"><button id="tL" class="on" onclick="mode('login')">Log in</button><button id="tS" onclick="mode('signup')">Create account</button></div>
<form id="fL" class="form" onsubmit="return login(event)"><label>Email<input id="le" type="email" required autocomplete="email"></label><label>Password<input id="lp" type="password" required autocomplete="current-password"></label><button class="btn primary">Log in</button><div class="err" id="lerr"></div></form>
<form id="fS" class="form hide" onsubmit="return signup(event)"><label>Full name<input id="sn" required></label><label>Email<input id="se" type="email" required autocomplete="email"></label><label>Password<input id="sp" type="password" minlength="6" required placeholder="At least 6 characters" autocomplete="new-password"></label><label>WhatsApp number<input id="sw" required placeholder="+91 9XXXXXXXXX"></label><label>Instagram username (optional)<input id="si" placeholder="@yourhandle"></label><button class="btn primary">Create account</button><div class="err" id="serr"></div><div class="ok" id="sok"></div></form>
</div></main>
<div class="modal" id="dup"><div class="card" style="max-width:400px;text-align:center"><div style="font-size:42px">👋</div><h2 style="margin:8px 0">You already have an account</h2><p class="muted">An account with <b id="dupEm"></b> already exists. Please log in instead.</p><button class="btn primary" onclick="goLogin()">Log in</button> <button class="btn" onclick="$('dup').classList.remove('show')">Close</button></div></div>
<script>const sb=supabase.createClient('https://stkubarpndhteijzqiph.supabase.co','sb_publishable_FMcNM1tgyyRYBAkZNdi_CA_mlbu4iWn');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mode(m){const l=m==='login';$('fL').classList.toggle('hide',!l);$('fS').classList.toggle('hide',l);$('tL').classList.toggle('on',l);$('tS').classList.toggle('on',!l);$('ttl').textContent=l?'Welcome back':'Create your account';$('sub').textContent=l?'Log in to see your dashboard and requests.':'Join BrightFrame Studio to send project requests.'}
function goLogin(){$('le').value=$('se').value;$('dup').classList.remove('show');mode('login');$('lp').focus()}
function dup(email){$('dupEm').textContent=email;$('dup').classList.add('show')}
async function login(e){e.preventDefault();$('lerr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(error){$('lerr').textContent=/confirm/i.test(error.message)?'Please confirm your email first. Check your inbox.':'Wrong email or password.';return false}location.href='dashboard.html';return false}
async function signup(e){e.preventDefault();$('serr').textContent='';$('sok').textContent='';const email=$('se').value.trim();
 const {data,error}=await sb.auth.signUp({email,password:$('sp').value,options:{emailRedirectTo:location.origin+'/dashboard.html',data:{full_name:$('sn').value.trim(),whatsapp:$('sw').value.trim(),instagram_username:$('si').value.trim()}}});
 if(error){if(/already|registered/i.test(error.message))dup(email);else $('serr').textContent=error.message;return false}
 if(data.user&&data.user.identities&&data.user.identities.length===0){dup(email);return false}
 if(data.session){location.href='dashboard.html'}else{$('sok').textContent='Account created! Check your email to confirm, then log in.'}return false}
sb.auth.getSession().then(({data})=>{if(data.session)location.replace('dashboard.html')});
if(new URLSearchParams(location.search).get('mode')==='signup')mode('signup');
</script></body></html>
